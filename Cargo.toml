# tora-typesetter workspace
[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/geometry",
    "crates/engine-core",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
