name: Generate legacy compatibility manifest

on:
  push:
    branches: [main]
    paths:
      - 'xtask/**'
      - 'legacy/runner-evidence.tsv'
      - 'docs/compat/**'
      - 'docs/provenance/**'
      - '.github/workflows/compat-manifest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'xtask/**'
      - 'legacy/runner-evidence.tsv'
      - 'docs/compat/**'
      - 'docs/provenance/**'
      - '.github/workflows/compat-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-pinned-sources:
    name: Scan six pinned source repositories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Rust target
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Orange V23
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Orange
          ref: 0b0ee279464a3db14672cd3f4051275aba5985da
          path: legacy/orange
          persist-credentials: false

      - name: Checkout Green V23
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Green
          ref: e5cde5f194d0d9e9b20fdaa2a742f9bf6e8aec53
          path: legacy/green
          persist-credentials: false

      - name: Checkout Gold V21
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Gold
          ref: a444d34ccad30fd5ed0d6fd3873adbe9c23cb7e0
          path: legacy/gold
          persist-credentials: false

      - name: Checkout Yellow V10 compatibility source
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Yellow
          ref: 878535e12eb4aa7e3c4a72e0e79687082d8a6d3b
          path: legacy/yellow
          persist-credentials: false

      - name: Checkout IMUD historical source
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/IMUD_TORANI
          ref: 6dd79d0ba224c169b0d19778ba181fc90edc8319
          path: legacy/imud
          persist-credentials: false

      - name: Checkout requirements and research source
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Typesetter_doc
          ref: 534b8f4e0ba9f5cb8abe9e3ad888904a217910cd
          path: legacy/docs
          persist-credentials: false

      - name: Verify all detached checkout commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy/orange rev-parse HEAD)" = "0b0ee279464a3db14672cd3f4051275aba5985da"
          test "$(git -C legacy/green rev-parse HEAD)" = "e5cde5f194d0d9e9b20fdaa2a742f9bf6e8aec53"
          test "$(git -C legacy/gold rev-parse HEAD)" = "a444d34ccad30fd5ed0d6fd3873adbe9c23cb7e0"
          test "$(git -C legacy/yellow rev-parse HEAD)" = "878535e12eb4aa7e3c4a72e0e79687082d8a6d3b"
          test "$(git -C legacy/imud rev-parse HEAD)" = "6dd79d0ba224c169b0d19778ba181fc90edc8319"
          test "$(git -C legacy/docs rev-parse HEAD)" = "534b8f4e0ba9f5cb8abe9e3ad888904a217910cd"
          echo "All six source checkouts match their exact commit pins."

      - name: Generate canonical compatibility manifest twice
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p xtask --locked -- compat-scan \
            --source SUGINACH/Tora_Book_Typesetter_Orange@0b0ee279464a3db14672cd3f4051275aba5985da@legacy-orange-v23=legacy/orange \
            --source SUGINACH/Tora_Book_Typesetter_Green@e5cde5f194d0d9e9b20fdaa2a742f9bf6e8aec53@legacy-green-v23=legacy/green \
            --source SUGINACH/Tora_Book_Typesetter_Gold@a444d34ccad30fd5ed0d6fd3873adbe9c23cb7e0@legacy-gold-v21=legacy/gold \
            --source SUGINACH/Tora_Book_Typesetter_Yellow@878535e12eb4aa7e3c4a72e0e79687082d8a6d3b@legacy-yellow-v10=legacy/yellow \
            --source SUGINACH/IMUD_TORANI@6dd79d0ba224c169b0d19778ba181fc90edc8319@legacy-imud-v20x=legacy/imud \
            --source SUGINACH/Typesetter_doc@534b8f4e0ba9f5cb8abe9e3ad888904a217910cd@requirements-docs=legacy/docs \
            --out artifacts/legacy-compatibility-manifest-first.json
          cargo run -p xtask --locked -- compat-scan \
            --source SUGINACH/Tora_Book_Typesetter_Orange@0b0ee279464a3db14672cd3f4051275aba5985da@legacy-orange-v23=legacy/orange \
            --source SUGINACH/Tora_Book_Typesetter_Green@e5cde5f194d0d9e9b20fdaa2a742f9bf6e8aec53@legacy-green-v23=legacy/green \
            --source SUGINACH/Tora_Book_Typesetter_Gold@a444d34ccad30fd5ed0d6fd3873adbe9c23cb7e0@legacy-gold-v21=legacy/gold \
            --source SUGINACH/Tora_Book_Typesetter_Yellow@878535e12eb4aa7e3c4a72e0e79687082d8a6d3b@legacy-yellow-v10=legacy/yellow \
            --source SUGINACH/IMUD_TORANI@6dd79d0ba224c169b0d19778ba181fc90edc8319@legacy-imud-v20x=legacy/imud \
            --source SUGINACH/Typesetter_doc@534b8f4e0ba9f5cb8abe9e3ad888904a217910cd@requirements-docs=legacy/docs \
            --out artifacts/legacy-compatibility-manifest-second.json
          diff -u artifacts/legacy-compatibility-manifest-first.json artifacts/legacy-compatibility-manifest-second.json
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("artifacts/legacy-compatibility-manifest-first.json").read_text(encoding="utf-8"))
          pins = json.loads(Path("docs/provenance/legacy-source-pins.json").read_text(encoding="utf-8"))
          matrix_text = Path("docs/compat/parity-matrix.md").read_text(encoding="utf-8")
          matrix_section = matrix_text.split("## 4. Stable test identifiers and measurable gates", 1)[1].split("## 5. Acceptance rules", 1)[0]
          declared_test_ids = set(re.findall(r"^\|\s*`([A-Z][A-Z0-9-]+)`\s*\|", matrix_section, re.MULTILINE))
          assert declared_test_ids, "parity matrix declares no stable test IDs"
          expected_sources = {(f"SUGINACH/{item['name']}", item["commit"]) for item in pins["repositories"]}
          actual_sources = {(item["repository"], item["commit"]) for item in manifest["sources"]}
          assert manifest.get("schemaVersion") == 1, "unexpected manifest schema version"
          assert actual_sources == expected_sources, "manifest source set differs from the six exact provenance pins"
          records = manifest.get("records")
          assert isinstance(records, list) and records, "manifest has no records"
          identifiers = [record.get("compatId") for record in records]
          assert all(identifiers) and len(identifiers) == len(set(identifiers)), "compatId missing or duplicated"
          required = ("kind", "repository", "commit", "sourcePath", "sourceSha256",
                      "owningProfile", "status", "parserOrConsumer", "assetDependencies",
                      "resolvedAssetDependencies", "unresolvedAssetDependencies",
                      "assetDependencyStatus", "rustOwner", "migrationRule", "testIds",
                      "acceptanceCriteria", "verificationLevel", "verificationEvidence", "notes")
          record_paths = {(record["owningProfile"], record["sourcePath"]) for record in records}
          for index, record in enumerate(records):
              missing = [field for field in required if field not in record]
              assert not missing, f"record {index} missing fields: {missing}"
              assert re.fullmatch(r"[0-9a-f]{64}", record["sourceSha256"]), f"record {index} has invalid SHA-256"
              assert record["rustOwner"].strip(), f"record {index} has no Rust owner"
              assert record["migrationRule"].strip(), f"record {index} has no migration rule"
              assert record["acceptanceCriteria"].strip(), f"record {index} has no acceptance criteria"
              assert isinstance(record["testIds"], list) and record["testIds"], f"record {index} has no test IDs"
              unknown_test_ids = sorted(set(record["testIds"]) - declared_test_ids)
              assert not unknown_test_ids, f"record {index} references undeclared test IDs: {unknown_test_ids}"
              assert isinstance(record["parityFixtures"], list), f"record {index} parityFixtures is not an array"
              assert all(isinstance(fixture, str) and fixture for fixture in record["parityFixtures"]), f"record {index} has an invalid fixture reference"
              assert isinstance(record["assetDependencies"], list), f"record {index} assetDependencies is not an array"
              assert isinstance(record["resolvedAssetDependencies"], list), f"record {index} resolvedAssetDependencies is not an array"
              assert isinstance(record["unresolvedAssetDependencies"], list), f"record {index} unresolvedAssetDependencies is not an array"
              for dependency in record["resolvedAssetDependencies"]:
                  assert dependency.startswith("local:"), f"record {index} resolved a non-local reference"
                  assert (record["owningProfile"], dependency.removeprefix("local:")) in record_paths, f"record {index} resolved outside its own profile"
              for dependency in record["unresolvedAssetDependencies"]:
                  assert dependency.startswith("local:"), f"record {index} unresolved list contains a non-local reference"
              assert isinstance(record["verificationEvidence"], list), f"record {index} evidence is not an array"
              if record["verificationEvidence"]:
                  assert record["verificationLevel"] != "scanned-hash-only", f"record {index} evidence level was not advanced"
              assert (record["repository"], record["commit"]) in actual_sources, f"record {index} is outside the pinned source set"
              if record["status"] == "verified-executable":
                  assert record["verificationEvidence"], f"record {index} claims execution without runner evidence"
          source_roots = {
              "legacy-orange-v23": Path("legacy/orange"),
              "legacy-green-v23": Path("legacy/green"),
              "legacy-gold-v21": Path("legacy/gold"),
              "legacy-yellow-v10": Path("legacy/yellow"),
              "legacy-imud-v20x": Path("legacy/imud"),
              "requirements-docs": Path("legacy/docs"),
          }
          source_profile_by_identity = {
              (item["repository"], item["commit"]): item["owningProfile"]
              for item in manifest["sources"]
          }
          active_statuses = {"verified-data", "verified-executable"}
          active_records = [record for record in records if record["status"] in active_statuses]
          for index, record in enumerate(records):
              fixtures = record["parityFixtures"]
              if record["status"] in active_statuses:
                  assert fixtures, f"active record {record['compatId']} has no parity fixture"
              for fixture in fixtures:
                  assert "@" in fixture and ":" in fixture, f"fixture reference is not profile-pinned: {fixture}"
                  repository, remainder = fixture.split("@", 1)
                  commit, fixture_path = remainder.split(":", 1)
                  identity = (repository, commit)
                  assert identity in source_profile_by_identity, f"fixture references an unpinned source: {fixture}"
                  fixture_profile = source_profile_by_identity[identity]
                  assert fixture_profile == record["owningProfile"], f"cross-profile fixture borrowing: {record['compatId']} -> {fixture}"
                  assert (fixture_profile, fixture_path) in record_paths, f"fixture record missing from manifest: {fixture}"
                  root = source_roots[fixture_profile]
                  assert (root / fixture_path).is_file(), f"fixture file missing from exact source checkout: {fixture}"
              if record["status"] in active_statuses:
                  root = source_roots[record["owningProfile"]]
                  source_file = root / record["sourcePath"]
                  assert source_file.is_file(), f"active source file missing: {record['compatId']}"
                  actual_sha256 = hashlib.sha256(source_file.read_bytes()).hexdigest()
                  assert actual_sha256 == record["sourceSha256"], f"active source hash changed: {record['compatId']}"
              if record["status"] in active_statuses and record["kind"] == "data":
                  assert "DATA-ROUNDTRIP" in record["testIds"], f"active data record lacks DATA-ROUNDTRIP: {record['compatId']}"
              if record["status"] in active_statuses and record["kind"] == "settings":
                  assert "SETTINGS-ROUNDTRIP" in record["testIds"], f"active settings record lacks SETTINGS-ROUNDTRIP: {record['compatId']}"
              if record["status"] in active_statuses and record["kind"] == "asset":
                  assert "ASSET-REFERENCE-CLOSURE" in record["testIds"], f"active asset record lacks ASSET-REFERENCE-CLOSURE: {record['compatId']}"
              if record["status"] in active_statuses and record["kind"] == "baseline":
                  assert "BASELINE-IDENTITY" in record["testIds"], f"baseline record lacks BASELINE-IDENTITY: {record['compatId']}"
              if record["status"] in active_statuses and record["kind"] in {"data", "settings", "baseline", "fixture"} and record["sourcePath"].lower().endswith((".json", ".jsonc", ".webmanifest")):
                  root = source_roots[record["owningProfile"]]
                  raw = (root / record["sourcePath"]).read_bytes()
                  parsed = json.loads(raw.decode("utf-8-sig"))
                  reparsed = json.loads(json.dumps(parsed, ensure_ascii=False))
                  assert reparsed == parsed, f"JSON fixture round-trip changed the value tree: {record['compatId']}"
          print(f"Fixture coverage validation passed: {len(active_records)} active records; every active record has an exact same-profile fixture; JSON data/settings/baselines round-trip.")
          font_records = [record for record in records if record["kind"] == "font"]
          assert font_records and all(record["status"] == "blocked-license" for record in font_records), "font records must remain blocked pending license review"
          spec_records = [record for record in records if record["owningProfile"] == "requirements-docs" and record["kind"] == "documentation"]
          assert spec_records and all(record["status"] == "spec-only" for record in spec_records), "requirements documentation must remain spec-only"
          snapshot_records = [record for record in records if record["owningProfile"] == "requirements-docs" and record["kind"] == "source-snapshot"]
          assert snapshot_records and all(record["status"] == "historical-only" for record in snapshot_records), "archived source snapshots must remain historical-only"
          resolved_count = sum(len(record["resolvedAssetDependencies"]) for record in records)
          unresolved_count = sum(len(record["unresolvedAssetDependencies"]) for record in records)
          active_unresolved = [
              (record, dependency)
              for record in records
              if record["status"] in active_statuses
              for dependency in record["unresolvedAssetDependencies"]
          ]
          historical_unresolved_records = [record for record in records if record["unresolvedAssetDependencies"]]
          historical_unresolved_paths = {
              (record["owningProfile"], dependency)
              for record in historical_unresolved_records
              for dependency in record["unresolvedAssetDependencies"]
          }
          active_unresolved_report = [
              {
                  "compatId": record["compatId"],
                  "profile": record["owningProfile"],
                  "sourcePath": record["sourcePath"],
                  "rustOwner": record["rustOwner"],
                  "migrationRule": record["migrationRule"],
                  "dependency": dependency,
                  "assetDependencyStatus": record["assetDependencyStatus"],
              }
              for record, dependency in active_unresolved
          ]
          with open("artifacts/legacy-compatibility-active-unresolved.json", "w", encoding="utf-8") as report:
              json.dump(active_unresolved_report, report, ensure_ascii=False, indent=2)
          print(f"Active unresolved local edges ({len(active_unresolved_report)}): " + json.dumps(active_unresolved_report, ensure_ascii=False))
          assert not active_unresolved, "active verified records have unresolved local dependencies"
          assert all(
              record["status"] == "historical-only"
              and record["rustOwner"]
              and record["migrationRule"]
              and record["testIds"]
              and record["acceptanceCriteria"]
              for record in historical_unresolved_records
          ), "every unresolved historical dependency must remain owner-assigned and documented"
          external_count = sum(sum(item.startswith("external:") for item in record["assetDependencies"]) for record in records)
          print(f"Active dependency closure passed: 0 unresolved edges across {len(active_records)} active records; {unresolved_count} unresolved edges across {len(historical_unresolved_paths)} paths are historical-only and owner-assigned.")
          print(f"Manifest schema and provenance validation passed: {len(actual_sources)} sources, {len(records)} records; {resolved_count} resolved local edges, {unresolved_count} historical-only unresolved local edges, {external_count} external references.")
          PY
          cp artifacts/legacy-compatibility-manifest-first.json artifacts/legacy-compatibility-manifest.json
          echo "Canonical manifest is byte-identical across two scans."

      - name: Upload generated manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-compatibility-manifest
          path: |
            artifacts/legacy-compatibility-manifest.json
            artifacts/legacy-compatibility-manifest-first.json
            artifacts/legacy-compatibility-active-unresolved.json
          if-no-files-found: warn
