name: Isolated legacy renderer audit

on:
  push:
    branches: [main]
    paths:
      - 'tools/legacy-runner/**'
      - 'docs/provenance/legacy-source-pins.json'
      - '.github/workflows/legacy-runner.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/legacy-runner/**'
      - 'docs/provenance/legacy-source-pins.json'
      - '.github/workflows/legacy-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A full-corpus replay can exceed one hour. Keep each immutable commit
  # in its own group so later pushes cannot cancel the evidence-producing run.
  group: legacy-runner-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  legacy-orange-smoke:
    name: Pinned Orange V23 / Chromium offline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Rust target
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Orange V23 source commit
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Orange
          ref: 0b0ee279464a3db14672cd3f4051275aba5985da
          path: legacy/orange
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy/orange/package-lock.json

      - name: Install pinned legacy dependencies
        working-directory: legacy/orange
        run: npm ci

      - name: Install pinned Playwright Chromium
        working-directory: legacy/orange
        run: npx playwright install --with-deps chromium

      - name: Verify pinned offline renderer and persist DOM geometry/ledger
        env:
          LEGACY_SOURCE_COMMIT: 0b0ee279464a3db14672cd3f4051275aba5985da
          RUST_TARGET_COMMIT: ${{ github.sha }}
        run: node tools/legacy-runner/run.cjs

      - name: Verify pinned Orange full-book corpus and compare historical baseline
        env:
          LEGACY_SOURCE_COMMIT: 0b0ee279464a3db14672cd3f4051275aba5985da
          RUST_TARGET_COMMIT: ${{ github.sha }}
        run: node tools/legacy-runner/run-long-corpus.cjs

      - name: Upload legacy DOM, geometry, ledger and provenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-orange-v23-renderer-smoke-and-long-corpus
          path: |
            artifacts/legacy-runner-manifest.json
            artifacts/legacy-long-corpus-manifest.json
            legacy/orange/artifacts/rust-legacy-smoke-report.json
            legacy/orange/artifacts/rust-legacy-smoke-summary.md
            legacy/orange/artifacts/rust-legacy-long-report.json
            legacy/orange/artifacts/rust-legacy-long-summary.md
          if-no-files-found: warn

  legacy-green-full-corpus:
    name: Pinned Green V23 / Chromium offline full-corpus baseline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Rust target
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Green V23 source commit
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Green
          ref: e5cde5f194d0d9e9b20fdaa2a742f9bf6e8aec53
          path: legacy/green
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated pinned Playwright
        working-directory: legacy/green
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0

      - name: Install pinned Playwright Chromium
        working-directory: legacy/green
        run: npx playwright install --with-deps chromium

      - name: Capture Green V23 full-corpus baseline or deterministic failure fingerprint
        env:
          LEGACY_SOURCE_COMMIT: e5cde5f194d0d9e9b20fdaa2a742f9bf6e8aec53
          RUST_TARGET_COMMIT: \${{ github.sha }}
        run: node tools/legacy-runner/run-green-long-corpus.cjs

      - name: Upload Green V23 full-corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-green-v23-full-corpus-baseline
          path: |
            artifacts/legacy-green-long-corpus-manifest.json
            artifacts/legacy-green-layout-failure.log
            artifacts/green-external-requests.txt
            legacy/green/artifacts/rust-green-long-report.json
            legacy/green/artifacts/rust-green-long-summary.md
          if-no-files-found: warn

