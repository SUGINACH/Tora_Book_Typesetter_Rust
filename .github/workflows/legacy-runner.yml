name: Isolated legacy renderer audit

on:
  push:
    branches: [main]
    paths:
      - 'tools/legacy-runner/**'
      - 'docs/provenance/legacy-source-pins.json'
      - '.github/workflows/legacy-runner.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/legacy-runner/**'
      - 'docs/provenance/legacy-source-pins.json'
      - '.github/workflows/legacy-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A full-corpus replay can exceed one hour. Keep each immutable commit
  # in its own group so later pushes cannot cancel the evidence-producing run.
  # Keep one active full-corpus replay per branch; newer runner code supersedes incomplete older attempts.
  group: legacy-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-orange-smoke:
    name: Pinned Orange V23 / Chromium offline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Rust target
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Orange V23 source commit
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Orange
          ref: 0b0ee279464a3db14672cd3f4051275aba5985da
          path: legacy/orange
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy/orange/package-lock.json

      - name: Install pinned legacy dependencies
        working-directory: legacy/orange
        run: npm ci

      - name: Install pinned Playwright Chromium
        working-directory: legacy/orange
        run: npx playwright install --with-deps chromium

      - name: Verify pinned offline renderer and persist DOM geometry/ledger
        env:
          LEGACY_SOURCE_COMMIT: 0b0ee279464a3db14672cd3f4051275aba5985da
          RUST_TARGET_COMMIT: ${{ github.sha }}
        run: node tools/legacy-runner/run.cjs

      - name: Verify pinned Orange full-book corpus and compare historical baseline
        env:
          LEGACY_SOURCE_COMMIT: 0b0ee279464a3db14672cd3f4051275aba5985da
          RUST_TARGET_COMMIT: ${{ github.sha }}
        run: node tools/legacy-runner/run-long-corpus.cjs

      - name: Upload legacy DOM, geometry, ledger and provenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-orange-v23-renderer-smoke-and-long-corpus
          path: |
            artifacts/legacy-runner-manifest.json
            artifacts/legacy-long-corpus-manifest.json
            legacy/orange/artifacts/rust-legacy-smoke-report.json
            legacy/orange/artifacts/rust-legacy-smoke-summary.md
            legacy/orange/artifacts/rust-legacy-long-report.json
            legacy/orange/artifacts/rust-legacy-long-summary.md
          if-no-files-found: warn

  legacy-green-full-corpus:
    name: Pinned Green V23 / Chromium offline full-corpus baseline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Rust target
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Green V23 source commit
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Green
          ref: e5cde5f194d0d9e9b20fdaa2a742f9bf6e8aec53
          path: legacy/green
          persist-credentials: false
      - name: Checkout pinned self-hosted Google font source
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Orange
          ref: 0b0ee279464a3db14672cd3f4051275aba5985da
          path: legacy/offline-fonts
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated pinned Playwright
        working-directory: legacy/green
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0

      - name: Install pinned Playwright Chromium
        working-directory: legacy/green
        run: npx playwright install --with-deps chromium

      - name: Syntax-check Green profile runner
        run: node --check tools/legacy-runner/run-green-long-corpus.cjs

      - name: Capture Green V23 full-corpus baseline or deterministic failure fingerprint
        env:
          LEGACY_SOURCE_COMMIT: e5cde5f194d0d9e9b20fdaa2a742f9bf6e8aec53
          RUST_TARGET_COMMIT: ${{ github.sha }}
        run: node tools/legacy-runner/run-green-long-corpus.cjs

      - name: Upload Green V23 full-corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-green-v23-full-corpus-baseline
          path: |
            artifacts/legacy-green-long-corpus-manifest.json
            artifacts/legacy-green-layout-failure.log
            artifacts/green-external-requests.txt
            legacy/green/artifacts/rust-green-long-report.json
            legacy/green/artifacts/rust-green-long-summary.md
          if-no-files-found: warn
  legacy-gold-v21-full-corpus:
    name: Pinned Gold V21 / Chromium offline full-document replay
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Rust target
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Gold V21 source commit
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Gold
          ref: a444d34ccad30fd5ed0d6fd3873adbe9c23cb7e0
          path: legacy/gold
          persist-credentials: false
      - name: Checkout pinned self-hosted Google font source
        uses: actions/checkout@v4
        with:
          repository: SUGINACH/Tora_Book_Typesetter_Orange
          ref: 0b0ee279464a3db14672cd3f4051275aba5985da
          path: legacy/offline-fonts
          persist-credentials: false

      - name: Setup pinned Node 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Install exact Gold package-lock dependencies
        working-directory: legacy/gold
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: legacy/gold
        run: npx playwright install --with-deps chromium

      - name: Syntax-check Gold profile runner
        run: node --check tools/legacy-runner/run-gold-v21-full-corpus.cjs

      - name: Run pinned Gold V21 full-corpus single-document replay with offline guard
        shell: bash
        env:
          RUST_TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory legacy/gold > /tmp/gold-v21-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
          node tools/legacy-runner/run-gold-v21-full-corpus.cjs

      - name: Upload Gold V21 full-document measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-gold-v21-full-document-measurement
          path: |
            artifacts/legacy-gold-v21-full-corpus-manifest.json
            artifacts/gold-v21-full-attempt-1/**
            artifacts/gold-v21-full-attempt-2/**
            artifacts/gold-v21-full-attempt-1.log
            artifacts/gold-v21-full-attempt-2.log
            artifacts/gold-full-chapter-mode-1.json
            artifacts/gold-full-chapter-mode-2.json
            artifacts/gold-full-external-1.txt
            artifacts/gold-full-external-2.txt
            artifacts/gold-full-page-errors-1.txt
            artifacts/gold-full-page-errors-2.txt
            artifacts/gold-full-console-errors-1.txt
            artifacts/gold-full-console-errors-2.txt
          if-no-files-found: warn
