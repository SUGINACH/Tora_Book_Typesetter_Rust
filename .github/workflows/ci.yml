name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned toolchain
        run: rustc --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace --all-targets --locked

      - name: Documentation tests
        run: cargo test --workspace --doc --locked

      - name: Build release
        run: cargo build --workspace --locked --release

      - name: Repeat clean build and compare workspace metadata
        shell: bash
        run: |
          cargo metadata --locked --no-deps --format-version 1 > metadata-first.json
          cargo clean
          cargo build --workspace --locked --release
          cargo metadata --locked --no-deps --format-version 1 > metadata-second.json
          diff -u metadata-first.json metadata-second.json

  quality-gate-probe:
    name: Verify quality gate rejects unwrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the unwrap lint fails closed
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path .github/quality-gate-probe/Cargo.toml -- -D warnings > probe.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat probe.log
            echo "ERROR: the intentional unwrap probe unexpectedly passed"
            exit 1
          fi
          if ! grep -q "unwrap_used" probe.log; then
            cat probe.log
            echo "ERROR: probe failed for a reason other than the unwrap lint"
            exit 1
          fi
          echo "PASS: Clippy rejected the intentional unwrap probe"
